version: "3.9"

services:

  # ── Infrastructure ──────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  firestore:
    build:
      context: infra/firestore
    environment:
      FIRESTORE_PROJECT_ID: workflow-platform-dev
    ports: ["8080:8080"]

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── HTTP Services ────────────────────────────────────────────

  auth-service:
    build:
      context: services/auth-service
      additional_contexts:
        shared: shared
    env_file: .env
    ports: ["8001:8000"]
    depends_on: [redis, firestore]

  tenant-user-service:
    build:
      context: services/tenant-user-service
      additional_contexts:
        shared: shared
    env_file: .env
    ports: ["8002:8000"]
    depends_on: [redis, firestore]

  workflow-service:
    build:
      context: services/workflow-service
      additional_contexts:
        shared: shared
    env_file: .env
    ports: ["8003:8000"]
    depends_on: [redis, firestore]

  notification-service:
    build:
      context: services/notification-service
      additional_contexts:
        shared: shared
    env_file: .env
    ports: ["8004:8000"]
    depends_on: [redis, firestore, mailhog]

  audit-service:
    build:
      context: services/audit-service
      additional_contexts:
        shared: shared
    env_file: .env
    ports: ["8005:8000"]
    depends_on: [redis, firestore]

  # ── Background Workers ───────────────────────────────────────

  outbox-relay:
    build:
      context: services/outbox-relay
      additional_contexts:
        shared: shared
    env_file: .env
    depends_on: [redis, firestore]

  worker-service:
    build:
      context: services/worker-service
      additional_contexts:
        shared: shared
    env_file: .env
    depends_on: [redis, mailhog]

  # ── Frontend (placeholder) ───────────────────────────────────

  frontend:
    build:
      context: ./frontend
    ports: ["3000:3000"]

  # ── Tools & Utilities ────────────────────────────────────────

  docs-generator:
    image: python:3.12-slim
    profiles: ["tools"]
    volumes:
      - ./docs:/docs
    depends_on:
      - auth-service
      - tenant-user-service
    command: >
      bash -c "
      pip install requests pyyaml &&
      python -c \"import requests, json, yaml; print('Fetching OpenAPI schema from auth-service...'); res1 = requests.get('http://auth-service:8000/openapi.json'); schema = res1.json(); print('Fetching OpenAPI schema from tenant-user-service...'); res2 = requests.get('http://tenant-user-service:8000/openapi.json'); tenant_schema = res2.json(); schema.setdefault('paths', {}).update(tenant_schema.get('paths', {})); schema.setdefault('components', {}).setdefault('schemas', {}).update(tenant_schema.get('components', {}).get('schemas', {})); schema['info']['title'] = 'Multi-Tenant Workflow Platform API'; f1 = open('/docs/openapi.json', 'w'); json.dump(schema, f1, indent=2); f1.close(); f2 = open('/docs/openapi.yaml', 'w'); yaml.dump(schema, f2, sort_keys=False); f2.close(); print('✅ Saved to docs/openapi.json and docs/openapi.yaml')\""
